# VisionQR – AI-Powered OMR and QR-Based Quiz Evaluation System

## 📌 Project Overview

VisionQR is an AI-powered desktop application developed to automate the process of evaluating quiz answer sheets containing both QR codes and OMR (Optical Mark Recognition) bubbles. The system reduces manual checking effort by automatically extracting student information, detecting marked answers, comparing them with the answer key, and generating results in CSV format.

The application is designed to handle scanned quiz sheets efficiently while providing accurate and structured output for instructors and institutions.

---

## 🎯 Objectives

* Automate quiz evaluation using Computer Vision techniques.
* Decode QR codes to identify student and quiz information.
* Detect and interpret OMR bubble selections.
* Generate structured result files automatically.
* Reduce human error in manual checking processes.
* Provide a user-friendly interface for educators.

---

## ✅ Features

### Task 1 – QR Code Detection

* Detects QR codes from uploaded quiz sheets.
* Extracts encoded information successfully.
* Supports standard QR code formats.

### Task 2 – Image Preprocessing

* Converts images into a format suitable for analysis.
* Performs noise reduction and image enhancement.
* Improves detection accuracy.

### Task 3 – OMR Bubble Detection

* Identifies answer bubbles from the answer sheet.
* Detects filled and unfilled options.
* Handles standard bubble sheet layouts.

### Task 4 – Answer Evaluation

* Compares detected answers with the provided answer key.
* Calculates student scores automatically.
* Generates evaluation results.

### Task 5 – CSV Result Generation

* Creates structured CSV files containing:

  * Student ID
  * Student Name (if available)
  * Selected Answers
  * Score
  * Evaluation Summary

---

## ⚠️ Current Limitation

The system relies on image quality for accurate OMR detection.

If:

* The answer sheet is blurry,
* The image is tilted excessively,
* The scan is incomplete,
* Bubbles are poorly marked,
* The sheet contains shadows or significant defects,

then OMR detection accuracy may decrease and some responses may not be evaluated correctly.

For best results:

* Use high-resolution scans.
* Ensure proper lighting.
* Keep the sheet flat during scanning.
* Mark bubbles clearly and completely.

